{% extends "base.html" %}
{% block title %} · Find Hospital{% endblock %}
{% block content %}

<div class="pg-header">
  <div class="pg-header-inner">
    <div class="pg-icon blue">🏨</div>
    <div>
      <h1>Find Government Hospital</h1>
      <p>Select your state and district to find nearby hospitals</p>
    </div>
  </div>
</div>

<div class="hosp-wrap">
  <div class="filter-panel">
    <div class="filter-row">
      <div class="fg">
        <label>State</label>
        <select id="stateSelect" onchange="loadDistricts()">
          <option value="">Select a state…</option>
          {% for s in states %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
        </select>
      </div>
      <div class="fg">
        <label>District</label>
        <select id="districtSelect" onchange="loadHospitals()" disabled>
          <option value="">Select a district…</option>
        </select>
      </div>
    </div>
  </div>

  <div id="hospResults"></div>
</div>

{% endblock %}
{% block scripts %}
<script>
async function loadDistricts() {
  const state = document.getElementById("stateSelect").value;
  const dsel = document.getElementById("districtSelect");
  document.getElementById("hospResults").innerHTML = "";
  if (!state) { dsel.disabled=true; return; }
  const res = await fetch("/api/districts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state})});
  const d = await res.json();
  dsel.innerHTML = '<option value="">Select a district…</option>';
  d.districts.forEach(x => dsel.innerHTML += `<option value="${x}">${x}</option>`);
  dsel.disabled = false;
}

async function loadHospitals() {
  const state = document.getElementById("stateSelect").value;
  const district = document.getElementById("districtSelect").value;
  const box = document.getElementById("hospResults");
  if (!district) { box.innerHTML=""; return; }
  box.innerHTML = `<div class="state-box"><div class="state-spinner"></div>Finding hospitals…</div>`;
  const res = await fetch("/api/hospitals",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state,district})});
  const d = await res.json();
  if (!d.hospitals.length) {
    box.innerHTML = `<div class="state-box">🏥 No hospitals found for this area.</div>`;
    return;
  }
  box.innerHTML = d.hospitals.map(h => `
    <div class="hcard">
      <div class="hcard-icon">🏥</div>
      <div class="hcard-body">
        <div class="hcard-name">${h.name}</div>
        <div class="hcard-meta">
          <span>📍 ${h.address}</span>
          <span>📞 <a href="tel:${h.phone}">${h.phone}</a></span>
        </div>
        <span class="htag">${h.type}</span>
      </div>
    </div>`).join("");
}
</script>
{% endblock %}
