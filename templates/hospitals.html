{% extends "base.html" %}
{% block title %} · Find Hospital{% endblock %}
{% block content %}
<div class="pg-hdr">
  <div class="pg-hdr-inner anim-up">
    <div class="pg-hdr-ic ib"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg></div>
    <div><h1 data-t="pg_hosp_title">Find Government Hospital</h1><p data-t="pg_hosp_sub">Select your state and district to find nearby hospitals</p></div>
    <div class="pg-hdr-meta"><div class="pg-tag">Free OPD</div><div class="pg-tag">Tap to call</div></div>
  </div>
</div>
<div class="hosp-wrap">
  <div class="filter-card anim-up">
    <div class="filter-row">
      <div class="fg"><label><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/></svg> State</label>
        <select id="stateSelect" onchange="loadDistricts()">
          <option value="">— Select your state —</option>
          {% for s in states %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
        </select>
      </div>
      <div class="fg"><label><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> District</label>
        <select id="districtSelect" onchange="loadHospitals()" disabled>
          <option value="">— Select district —</option>
        </select>
      </div>
    </div>
  </div>
  <div id="hospResults">
    <div class="state-box">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--t4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Select your state and district to find hospitals</span>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadDistricts(){
  const state=document.getElementById('stateSelect').value;
  const dsel=document.getElementById('districtSelect');
  document.getElementById('hospResults').innerHTML=`<div class="state-box"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--bl)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg><span>Now select your district</span></div>`;
  if(!state){dsel.disabled=true;return}
  const r=await fetch('/api/districts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state})});
  const d=await r.json();
  dsel.innerHTML='<option value="">— Select district —</option>';
  d.districts.forEach(x=>dsel.innerHTML+=`<option value="${x}">${x}</option>`);
  dsel.disabled=false;
}
async function loadHospitals(){
  const state=document.getElementById('stateSelect').value;
  const district=document.getElementById('districtSelect').value;
  const box=document.getElementById('hospResults');
  if(!district){return}
  box.innerHTML=`<div class="state-box"><div class="spinner"></div>Finding hospitals in ${district}…</div>`;
  const r=await fetch('/api/hospitals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state,district})});
  const d=await r.json();
  if(!d.hospitals.length){
    box.innerHTML=`<div class="state-box"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--t4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg><span>No hospitals found for ${district}. Try a nearby district.</span></div>`;return;
  }
  box.innerHTML=`
    <div style="font-size:.78rem;color:var(--t3);margin-bottom:12px;padding:0 2px">
      Found <strong style="color:var(--bl)">${d.hospitals.length} hospital${d.hospitals.length>1?'s':''}</strong> in ${district}, ${state}
    </div>
    <div class="hosp-grid">
    ${d.hospitals.map((h,i)=>`
      <div class="hcard" style="animation-delay:${i*60}ms">
        <div class="hcard-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg></div>
        <div class="hcard-body">
          <div class="hcard-name">${h.name}</div>
          <div class="hcard-meta">
            <span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> ${h.address}</span>
            <span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.36 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg> <a href="tel:${h.phone}">${h.phone}</a></span>
          </div>
          <div class="hcard-tags">
            <span class="htag">${h.type}</span>
            <span class="htag free">Free OPD</span>
            ${h.emergency?'<span class="htag emg">Emergency</span>':''}
          </div>
        </div>
        <div class="hcard-action"><a href="tel:${h.phone}" class="call-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.36 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg> Call</a></div>
      </div>`).join('')}
    </div>`;
}
</script>
{% endblock %}
