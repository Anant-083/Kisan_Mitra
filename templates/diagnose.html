<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FasalMitra · Diagnose</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-brand">🌾 FasalMitra</a>
  <div class="nav-links">
    <a href="/">🏠 Home</a>
    <a href="/market">📈 Market</a>
    <a href="/alerts">🔔 Alerts</a>
  </div>
  <div class="hamburger" id="hamburger" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </div>
</nav>

<div class="mobile-menu" id="mobile-menu">
  <a href="/">🏠 Home</a>
  <a href="/market">📈 Market</a>
  <a href="/alerts">🔔 Alerts</a>
</div>
<div class="mobile-overlay" id="mobile-overlay" onclick="toggleMenu()"></div>

<div class="page-title">
  <h2>🔍 Diagnose Crop Disease</h2>
  <p>Upload or take photo of affected crop leaf</p>
</div>

<div class="main-container" style="margin-top:0">

  <div class="diagnose-card">

    <div class="upload-area" id="upload-area" onclick="document.getElementById('file-upload').click()">
      <div class="upload-icon">📁</div>
      <p>Click to upload from gallery</p>
      <small>JPG, PNG supported</small>
    </div>

    <!-- File upload - gallery only -->
    <input type="file" id="file-upload" accept="image/*"
           style="display:none" onchange="previewImage(this)"/>

    <!-- Camera capture - opens camera directly -->
    <button class="camera-btn" onclick="document.getElementById('camera-capture').click()">
      📷 Take Photo with Camera
    </button>
    <input type="file" id="camera-capture" accept="image/*" capture="environment"
           style="display:none" onchange="previewImage(this)"/>

    <img id="preview" style="display:none;width:100%;border-radius:14px;margin-top:14px;box-shadow:0 4px 16px rgba(0,0,0,0.1);"/>

    <div class="mt-3">
      <label style="font-weight:600;font-size:0.9rem;color:var(--text)">
        📝 Describe the problem (optional):
      </label>
      <textarea id="description" rows="3"
        placeholder="e.g. Leaves turning yellow with brown spots..."
        style="width:100%;border:2px solid #d8eedd;border-radius:12px;padding:12px;font-family:Poppins,sans-serif;font-size:0.85rem;outline:none;resize:none;margin-top:8px;"></textarea>
    </div>

    <button class="go-btn mt-3" onclick="diagnoseImage()">
      🔍 Diagnose Now
    </button>

  </div>

  <div class="result-card" id="result-card" style="display:none">
    <div class="typing" id="diag-typing" style="margin-bottom:8px">
      <span></span><span></span><span></span>
    </div>
    <div id="diagnosis-result" style="white-space:pre-wrap;line-height:1.8;font-size:0.92rem;"></div>
  </div>

  <a href="/" class="back-link">← Back to Home</a>

</div>

<footer class="footer">
  <strong>FasalMitra</strong> · AI-Powered Crop Advisory · Built for Indian Farmers 🌾
</footer>

<script>
function toggleMenu() {
  const menu = document.getElementById('mobile-menu');
  const overlay = document.getElementById('mobile-overlay');
  menu.classList.toggle('open');
  overlay.classList.toggle('open');
}

function previewImage(input) {
  const preview = document.getElementById('preview');
  const uploadArea = document.getElementById('upload-area');
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      preview.src = e.target.result;
      preview.style.display = 'block';
      uploadArea.style.display = 'none';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

async function diagnoseImage() {
  const fileInput = document.getElementById('file-upload').files[0] ||
                    document.getElementById('camera-capture').files[0];
  const description = document.getElementById('description').value;
  const resultCard = document.getElementById('result-card');
  const typingEl = document.getElementById('diag-typing');
  const resultEl = document.getElementById('diagnosis-result');

  if (!fileInput) {
    alert("Please select or capture an image first!");
    return;
  }

  resultCard.style.display = 'block';
  typingEl.style.display = 'flex';
  resultEl.innerHTML = '';
  resultCard.scrollIntoView({behavior: 'smooth'});

  const chosenLang = localStorage.getItem('selectedLanguage') || 'English';
  const formData = new FormData();
  formData.append('image', fileInput);
  formData.append('description', description || "Crop looks diseased");
  formData.append('lang', chosenLang);

  try {
    const response = await fetch('/diagnose_crop', {method:'POST', body:formData});
    const data = await response.json();
    typingEl.style.display = 'none';
    if (data.success) {
      resultEl.innerHTML = `<div>${data.diagnosis.replace(/\n/g,'<br>')}</div>`;
    } else {
      resultEl.innerHTML = `<p style="color:#d32f2f;font-weight:600">❌ Error: ${data.error}</p>`;
    }
  } catch(e) {
    typingEl.style.display = 'none';
    resultEl.innerHTML = `<p style="color:#d32f2f;font-weight:600">❌ Request failed. Check connection.</p>`;
  }
}
</script>
</body>
</html>
