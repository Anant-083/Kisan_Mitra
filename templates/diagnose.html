<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KisanMitra · Diagnose</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<nav class="navbar">
 <a href="/" class="nav-brand">🌾 FasalMitra</a>
  <div class="nav-links">
    <a href="/">🏠 Home</a>
    <a href="/market">📈 Market</a>
    <a href="/alerts">🔔 Alerts</a>
  </div>
</nav>

<div class="container main-container">
  <div class="page-title">
    <h2>🔍 Diagnose Crop Disease</h2>
    <p>Upload or take photo of affected crop</p>
  </div>

  <div class="diagnose-card">
    <div class="upload-area" id="upload-area" onclick="document.getElementById('crop-image').click()">
      <div class="upload-icon">📸</div>
      <p>Click to upload or take photo</p>
      <small>JPG, PNG supported</small>
    </div>
    <input type="file" id="crop-image" accept="image/*" capture="environment" style="display:none" onchange="previewImage(this)"/>

    <img id="preview" style="display:none; width:100%; border-radius:12px; margin-top:12px;"/>

    <div class="mt-3">
      <label style="font-weight:600; font-size:0.9rem;">Describe the problem (optional):</label>
      <textarea id="description" class="form-control mt-2" rows="3" placeholder="e.g. Leaves turning yellow with brown spots..."></textarea>
    </div>

    <button class="go-btn mt-3" onclick="diagnoseImage()">🔍 Diagnose Now</button>
  </div>

  <div class="result-card" id="result-card" style="display:none">
    <div class="typing" id="diag-typing">
      <span></span><span></span><span></span>
    </div>
    <div id="diagnosis-result" style="white-space: pre-wrap; line-height: 1.6; font-size: 0.95rem;"></div>
  </div>

  <a href="/" class="back-link">← Back to Home</a>
</div>

<!-- Kindwise & Groq API Integration Script -->
<script>
function previewImage(input) {
    const preview = document.getElementById('preview');
    const uploadArea = document.getElementById('upload-area');
    
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
            uploadArea.style.display = 'none'; // Hides the upload box for a clean UI preview
        }
        reader.readAsDataURL(input.files[0]);
    }
}

async function diagnoseImage() {
    const fileInput = document.getElementById('crop-image');
    const description = document.getElementById('description').value;
    const resultCard = document.getElementById('result-card');
    const typingIndicator = document.getElementById('diag-typing');
    const resultContainer = document.getElementById('diagnosis-result');

    // Validation: Ensure an image is chosen before hitting the servers
    if (!fileInput.files[0]) {
        alert("Please select or capture an image first!");
        return;
    }

    // Unveil the results area and animate the loading dots
    resultCard.style.display = 'block';
    typingIndicator.style.display = 'block';
    resultContainer.innerHTML = '';

    // Fetch language preference from homepage selections, fallback to English
    const chosenLang = localStorage.getItem("selectedLanguage") || "English";

    // Packing parameters into multipart form data (required for file streams)
    const formData = new FormData();
    formData.append('image', fileInput.files[0]);
    formData.append('description', description);
    formData.append('lang', chosenLang);

    try {
        const response = await fetch('/diagnose_crop', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        typingIndicator.style.display = 'none'; // Kill the loading dots

        if (data.success) {
            // Render the formatted, localized diagnosis response string smoothly
            resultContainer.innerHTML = `<div>${data.diagnosis.replace(/\n/g, '<br>')}</div>`;
        } else {
            resultContainer.innerHTML = `<p style="color:#d32f2f; font-weight:600;">❌ Error: ${data.error}</p>`;
        }
    } catch (error) {
        typingIndicator.style.display = 'none';
        resultContainer.innerHTML = `<p style="color:#d32f2f; font-weight:600;">❌ Request failed. Please check your network connection.</p>`;
    }
}
</script>
</body>
</html>
