<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FasalMitra · Advisory</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-brand">🌾 FasalMitra</a>
  <div class="nav-links">
    <a href="/">🏠 Home</a>
    <a href="/diagnose">🔍 Diagnose</a>
    <a href="/market">📈 Market</a>
    <a href="/alerts">🔔 Alerts</a>
  </div>
  <div class="hamburger" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </div>
</nav>

<div class="mobile-menu" id="mobile-menu">
  <a href="/">🏠 Home</a>
  <a href="/diagnose">🔍 Diagnose</a>
  <a href="/market">📈 Market</a>
  <a href="/alerts">🔔 Alerts</a>
</div>

<div class="main-container">
  <div class="chat-header">
    <div class="crop-icon">🌾</div>
    <div>
      <h3>{{ crop }} · {{ problem }}</h3>
      <p>Language: {{ lang }}</p>
    </div>
  </div>

  <div class="chat-box" id="chat-box">
    <div class="typing" id="typing">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="audio-bar" id="audio-bar" style="display:none">
    <button onclick="playAudio()">🔊</button>
    <span>Tap to hear advice in {{ lang }}</span>
  </div>

  <div class="input-row mt-3">
    <input type="text" id="user-input" placeholder="Ask more..."
           onkeydown="if(event.key==='Enter') sendMessage()"/>
    <button onclick="sendMessage()">➤</button>
  </div>

  <a href="/" class="back-link">← Back to Home</a>
</div>

<script>
const lang = "{{ lang }}";
const crop = "{{ crop }}";
const problem = "{{ problem }}";
let currentAudio = null;

window.onload = () => fetchAdvice("");

function fetchAdvice(question) {
  document.getElementById("typing").style.display = "flex";
  document.getElementById("audio-bar").style.display = "none";
  fetch("/get_advice", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({lang, crop, problem, question})
  })
  .then(r => r.json())
  .then(data => {
    document.getElementById("typing").style.display = "none";
    addMessage("FasalMitra 🌾", data.advice, "bot");
    if (data.audio_url) {
      currentAudio = new Audio(data.audio_url);
      document.getElementById("audio-bar").style.display = "flex";
    }
  })
  .catch(() => {
    document.getElementById("typing").style.display = "none";
    addMessage("FasalMitra 🌾", "Something went wrong. Please try again.", "bot");
  });
}

function sendMessage() {
  const input = document.getElementById("user-input");
  const text = input.value.trim();
  if (!text) return;
  addMessage("You", text, "user");
  input.value = "";
  fetchAdvice(text);
}

function addMessage(sender, text, type) {
  const box = document.getElementById("chat-box");
  const div = document.createElement("div");
  div.className = `msg ${type}`;
  div.innerHTML = `<div class="sender">${sender}</div><div class="bubble">${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function playAudio() {
  if (currentAudio) currentAudio.play();
}

function toggleMenu() {
  document.getElementById('mobile-menu').classList.toggle('open');
}
</script>
</body>
</html>
