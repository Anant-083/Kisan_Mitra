<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FasalMitra · Market Prices</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<nav class="navbar">
  <a href="/" class="nav-brand"><span>🌾</span> FasalMitra</a>
  <div class="nav-links">
    <a href="/">🏠 Home</a>
    <a href="/diagnose">🔍 Diagnose</a>
    <a href="/alerts">🔔 Alerts</a>
  </div>
  <div class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></div>
</nav>
<div class="mobile-menu" id="mobile-menu">
  <button class="menu-close" onclick="toggleMenu()">✕</button>
  <a href="/" onclick="toggleMenu()">🏠 Home</a>
  <a href="/diagnose" onclick="toggleMenu()">🔍 Diagnose</a>
  <a href="/alerts" onclick="toggleMenu()">🔔 Alerts</a>
</div>
<div class="mobile-overlay" id="mobile-overlay" onclick="toggleMenu()"></div>

<div class="page-hero">
  <h2>📈 Mandi Market Prices</h2>
  <p id="market-status">Live crop prices across India</p>
</div>

<div class="container" style="padding-top:20px">
  <div class="card">
    <div class="search-row">
      <input class="search-input" type="text" id="search-state" placeholder="🗺️ State (e.g. Bihar, Punjab)"/>
      <input class="search-input" type="text" id="search-commodity" placeholder="🌾 Crop (e.g. Wheat, Rice)"/>
      <button class="search-btn" onclick="searchMarket()">Search</button>
    </div>
    <div class="legend-strip mt-3">
      <span class="legend-pill">🟢 High Demand</span>
      <span class="legend-pill">🟡 Stable</span>
      <span class="legend-pill">🔴 Low Demand</span>
    </div>
  </div>

  <div class="market-table-wrap mt-3">
    <table class="market-table">
      <thead>
        <tr>
          <th>State</th><th>Market</th><th>Crop</th>
          <th>Min ₹</th><th>Max ₹</th><th>Modal ₹</th><th>Trend</th>
        </tr>
      </thead>
      <tbody id="market-body">
        <tr><td colspan="7" style="text-align:center;padding:20px;color:var(--muted)">⏳ Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="chart-card mt-4">
    <p style="font-size:0.85rem;font-weight:700;margin-bottom:14px">📊 Price Analysis Chart</p>
    <canvas id="market-chart"></canvas>
  </div>

  <a href="/" class="back-link mt-4">← Back to Home</a>
</div>

<footer class="footer">
  <strong>FasalMitra</strong> · Market data from Agmarknet 🌾
</footer>

<script src="/static/market.js"></script>
<script>
function toggleMenu() {
  document.getElementById('mobile-menu').classList.toggle('open');
  document.getElementById('mobile-overlay').classList.toggle('open');
}
</script>
</body>
</html>
