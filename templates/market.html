 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KisanMitra · Market</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">🌾 KisanMitra</div>
  <div class="nav-links">
    <a href="/">🏠 Home</a>
    <a href="/diagnose">🔍 Diagnose</a>
    <a href="/alerts">🔔 Alerts</a>
  </div>
</nav>

<div class="container main-container">
  <div class="page-title">
    <h2>📈 Mandi Market Prices</h2>
    <p>Live crop prices across India</p>
  </div>

  <!-- SEARCH BAR -->
  <div class="search-bar">
    <input type="text" id="search-state" placeholder="🔍 Search by state (e.g. Punjab)"/>
    <input type="text" id="search-commodity" placeholder="🌾 Search by crop (e.g. Wheat)"/>
    <button onclick="searchMarket()">Search</button>
  </div>

  <!-- LEGEND -->
  <div class="legend-bar">
    <span class="legend-up">🟢 High Demand</span>
    <span class="legend-down">🔴 Low Demand</span>
    <span class="legend-neutral">🟡 Stable</span>
  </div>

  <!-- MARKET TABLE -->
  <div class="market-table-wrapper">
    <table class="market-table" id="market-table">
      <thead>
        <tr>
          <th>State</th>
          <th>Market</th>
          <th>Crop</th>
          <th>Min ₹</th>
          <th>Max ₹</th>
          <th>Modal ₹</th>
          <th>Trend</th>
        </tr>
      </thead>
      <tbody id="market-body">
        <tr><td colspan="7" style="text-align:center">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- CHART -->
  <div class="section-title mt-4">
    <h2>📊 Price Analysis Chart</h2>
  </div>
  <div class="chart-wrapper">
    <canvas id="market-chart"></canvas>
  </div>

  <a href="/" class="back-link">← Back to Home</a>
</div>

<script src="/static/market.js"></script>
</body>
</html>
